<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Plank-test</title>
	<style>
		body { min-height: 100vh;  margin: 0; display: flex; flex-direction: column; }
		.app { width: max-content; margin: auto; padding: 10px; }
		.top-buttons, .bottom-buttons { margin: 10px 0; }
		button:not(:disabled) { cursor: pointer; }
	</style>
</head>
<body>
	<div class="app">
		<div class="top-buttons">
			<button type="button" id="btn-solve">Solve</button>
			<button type="button" id="btn-reset">Reset</button>
			<button type="button" id="btn-undo">Undo</button>
			<button type="button" id="btn-redo">Redo</button>
		</div>
		<canvas id="plank-canvas" width="600" height="450" style="background-color:#cfddfc;"></canvas>
		<div class="bottom-buttons">
			<button type="button" id="btn-prev-level">Prev</button>
			<button type="button" id="btn-next-level">Next</button>
		</div>
		<div class="status">
			<span>Level: </span><span id="level-number">0/0</span>
		</div>
	</div>

	<script src="plank-puzzle-solver.js" type="module"></script>
</body>
</html>
